name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish existing release assets to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install verification dependencies
        run: python -m pip install "packaging" "twine>=5"
      - name: Prepare asset directory
        run: mkdir dist
      - name: Validate release tag
        run: python -c 'import os; from scripts.verify_release_version import version_from_tag; version_from_tag(os.environ["RELEASE_TAG"])'
      - name: Download release assets
        run: gh release download "$RELEASE_TAG" --dir dist
      - name: Reject unexpected release assets
        run: python -c 'from pathlib import Path; extras = [p.name for p in Path("dist").iterdir() if p.name != "SHA256SUMS" and p.suffix != ".whl" and not p.name.endswith(".tar.gz")]; assert not extras, extras'
      - name: Verify release asset hashes
        run: cd dist && shasum -a 256 -c SHA256SUMS
      - name: Verify release tag matches assets
        run: python scripts/verify_release_version.py --tag "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
      - name: Check distribution metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Remove checksum asset before publish
        run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
