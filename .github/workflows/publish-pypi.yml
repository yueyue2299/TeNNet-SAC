name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish existing release assets to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install verification dependencies
        run: python -m pip install "packaging" "twine>=5"
      - name: Prepare asset directory
        run: mkdir dist
      - name: Validate release tag
        run: python -c 'import os; from scripts.verify_release_version import version_from_tag; version_from_tag(os.environ["RELEASE_TAG"])'
      - name: Download release assets
        run: gh release download "$RELEASE_TAG" --dir dist
      - name: Reject unexpected release assets
        run: |
          python - <<'PY'
          from pathlib import Path

          extras = [
              path.name
              for path in Path("dist").iterdir()
              if (
                  path.name != "SHA256SUMS"
                  and path.suffix != ".whl"
                  and not path.name.endswith(".tar.gz")
              )
          ]
          if extras:
              raise SystemExit(f"unexpected release assets: {extras}")
          PY
      - name: Verify checksum manifest covers downloaded distributions
        run: python scripts/verify_release_version.py --verify-sha256sums dist/SHA256SUMS dist/*.whl dist/*.tar.gz
      - name: Verify release asset hashes
        run: cd dist && shasum -a 256 -c SHA256SUMS
      - name: Verify release tag matches assets
        run: python scripts/verify_release_version.py --tag "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
      - name: Verify distribution contents
        run: python scripts/verify_distribution.py dist/*.whl dist/*.tar.gz
      - name: Check distribution metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Remove checksum asset before publish
        run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
