name: Build draft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and draft GitHub Release
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install ".[test,build]"
      - name: Run unit and regression tests
        run: python -m pytest -m "not integration" -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify distribution contents
        run: python scripts/verify_distribution.py dist/*
      - name: Verify bundled model artifacts
        run: python -c 'from tennetsac.model_manifest import verify_bundled_artifacts; errors = verify_bundled_artifacts(); assert not errors, errors'
      - name: Verify release tag matches distributions
        run: python scripts/verify_release_version.py --tag "$GITHUB_REF_NAME" dist/*
      - name: Install release wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed release version
        run: python -c 'import os, tennetsac; assert tennetsac.__version__ == os.environ["GITHUB_REF_NAME"].removeprefix("v")'
      - name: Generate release checksums
        run: cd dist && shasum -a 256 * > SHA256SUMS
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tennetsac-release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Create draft GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --draft --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
