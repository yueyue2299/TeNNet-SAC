name: Build draft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and draft GitHub Release
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install ".[test,build]"
      - name: Run unit and regression tests
        run: python -m pytest -m "not integration" -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify distribution contents
        run: python scripts/verify_distribution.py dist/*
      - name: Verify release tag matches distributions
        run: python scripts/verify_release_version.py --tag "$GITHUB_REF_NAME" dist/*
      - name: Verify the installed release wheel
        run: |
          release_dir="$(mktemp -d)"
          python -m pip install --no-deps --target "$release_dir" dist/*.whl
          (
            cd "$release_dir"
            PYTHONPATH="$release_dir" GITHUB_REF_NAME="$GITHUB_REF_NAME" python - <<'PY'
          import os
          from pathlib import Path

          import tennetsac
          from tennetsac.model_manifest import verify_bundled_artifacts

          package = Path(tennetsac.__file__).resolve()
          try:
              package.relative_to(Path.cwd())
          except ValueError:
              raise SystemExit(f"source checkout shadowed installed wheel: {package}")
          expected_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tennetsac.__version__ != expected_version:
              raise SystemExit(
                  f"installed version mismatch: {tennetsac.__version__} != "
                  f"{expected_version}"
              )
          errors = verify_bundled_artifacts()
          if errors:
              raise SystemExit("\n".join(errors))
          PY
          )
      - name: Generate release checksums
        run: cd dist && shasum -a 256 * > SHA256SUMS
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tennetsac-release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Create draft GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --draft --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
