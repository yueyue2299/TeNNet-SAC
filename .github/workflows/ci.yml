name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONWARNINGS: "error::ResourceWarning"

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install ".[test,build]"
      - name: Run unit and regression tests
        run: python -m pytest -m "not integration" -v

  tokenizer-compatibility:
    name: SMI-TED tokenizer (${{ matrix.transformers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ["transformers==4.36.2", "transformers>=5,<6"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and tokenizer test dependencies
        run: |
          python -m pip install --no-deps .
          python -m pip install "pytest>=8" "torch>=2.1.2" "${{ matrix.transformers }}"
      - name: Run tokenizer compatibility tests
        run: python -m pytest tests/test_smi_ted_tokenizer.py -v

  distribution:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install ".[test,build]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify distribution contents
        run: python scripts/verify_distribution.py dist/*
      - name: Verify the installed wheel outside the checkout
        run: |
          smoke_dir="$(mktemp -d)"
          python -m pip install --no-deps --target "$smoke_dir" dist/*.whl
          (
            cd "$smoke_dir"
            PYTHONPATH="$smoke_dir" python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          import tennetsac
          from tennetsac.model_manifest import verify_bundled_artifacts

          package = Path(tennetsac.__file__).resolve()
          try:
              package.relative_to(Path.cwd())
          except ValueError:
              raise SystemExit(f"source checkout shadowed installed wheel: {package}")
          installed_version = version("tennetsac")
          if tennetsac.__version__ != installed_version:
              raise SystemExit(
                  f"installed version mismatch: {tennetsac.__version__} != "
                  f"{installed_version}"
              )
          errors = verify_bundled_artifacts()
          if errors:
              raise SystemExit("\n".join(errors))
          print(package)
          PY
          )
