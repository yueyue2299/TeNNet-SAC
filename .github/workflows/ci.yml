name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONWARNINGS: "error::ResourceWarning"

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install ".[test,build]"
      - name: Run unit and regression tests
        run: python -m pytest -m "not integration" -v

  tokenizer-compatibility:
    name: SMI-TED tokenizer (${{ matrix.transformers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ["transformers==4.36.2", "transformers>=5,<6"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and tokenizer test dependencies
        run: |
          python -m pip install --no-deps .
          python -m pip install "pytest>=8" "torch>=2.1.2" "${{ matrix.transformers }}"
      - name: Run tokenizer compatibility tests
        run: python -m pytest tests/test_smi_ted_tokenizer.py -v

  distribution:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install ".[test,build]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify distribution contents
        run: python scripts/verify_distribution.py dist/*
      - name: Install and import the wheel outside the checkout
        run: |
          smoke_dir="$(mktemp -d)"
          python -m pip install --no-deps --target "$smoke_dir" dist/*.whl
          (
            cd "$smoke_dir"
            PYTHONPATH="$smoke_dir" python -c 'import pathlib; import tennetsac; package = pathlib.Path(tennetsac.__file__).resolve(); assert package.is_relative_to(pathlib.Path.cwd()); print(package)'
          )
