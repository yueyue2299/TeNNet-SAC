[build-system]
requires = ["setuptools>=77", "setuptools-scm>=10.2.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tennetsac"
dynamic = ["version"]
description = "Thermodynamics-embedded Neural Network for Segment Activity Coefficients"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT AND Apache-2.0"
license-files = [
  "LICENSE",
  "licenses/IBM-materials-APACHE-2.0.txt",
  "licenses/fast-transformers-MIT.txt",
  "THIRD_PARTY_NOTICES.md",
]
authors = [{ name = "Yue Yang" }]
dependencies = [
  "numpy>=1.25,<2",
  "pandas<2.2",
  "pyarrow<15",
  "scikit-learn",
  "scipy",
  "rdkit",
  "matplotlib",
  "tqdm",
  "transformers==4.36.2",
  "huggingface-hub",
  "safetensors",
  "tokenizers",
  "accelerate",
  "torch>=2.1.2",
  "platformdirs",
  "filelock",
]

[project.optional-dependencies]
test = ["pytest>=8", "packaging", "PyYAML>=6"]
build = [
  "build>=1.2",
  "setuptools>=77",
  "setuptools-scm>=10.2.3",
  "twine>=5",
]
dev = [
  "pytest>=8",
  "packaging",
  "PyYAML>=6",
  "build>=1.2",
  "twine>=5",
  "jupyterlab",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tennetsac = [
  "model_manifest.json",
  "assets/*.md",
  "smi_ted_light/*.txt",
  "ckpt_files/*.ckpt",
  "ckpt_files/fine-tuned/gamma-ensemble-v1.safetensors",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.py[cod]", "*.so", "__pycache__/*"]

[tool.setuptools_scm]
write_to = "src/tennetsac/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.dev0"

[tool.setuptools_scm.tag]
prefix = "v"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires locally available full model weights"]
